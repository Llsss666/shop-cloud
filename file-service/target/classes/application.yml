server:
  port: 8085

spring:
  application:
    name: file-service

  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        username: nacos
        password: nacos

  redis:
    host: localhost
    port: 6379
    database: 3

  web:
    resources:
      static-locations: file:D:/upload/

# 图片访问映射
mvc:
  static-path-pattern: /file/**

# Seata 统一配置
seata:
  tx-service-group: freshshop_tx_group
  config:
    type: file
  registry:
    type: file
  service:
    vgroup-mapping:
      freshshop_tx_group: default
    grouplist:
      default: 127.0.0.1:8091
  datasource:
    proxy:
      enable: true
  transport:
    serialization: seata
    compressor: none
    max-frame-size: 20971520