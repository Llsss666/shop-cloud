server:
  port: 8080

spring:
  application:
    name: fresh-shop-gateway

  cloud:
    gateway:
      # 跨域
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

      # 🔥 完整路由（你所有微服务都在这里）
      routes:
        # 用户服务
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/user/**

        # 订单服务
        - id: order-service
          uri: http://localhost:8082
          predicates:
            - Path=/order/**,/admin/order/**

        # 商品服务 ✅【补上了！】
        - id: product-service
          uri: http://localhost:8083
          predicates:
            - Path=/product/**,/admin/product/**

        # 营销服务（优惠券、秒杀）
        - id: marketing-service
          uri: http://localhost:8084
          predicates:
            - Path=/coupon/**,/seckill/**,/admin/seckill/**

        # 文件服务
        - id: file-service
          uri: http://localhost:8085
          predicates:
            - Path=/file/**

logging:
  level:
    org.springframework.cloud.gateway: INFO