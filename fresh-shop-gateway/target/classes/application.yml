server:
  port: 8080

spring:
  application:
    name: fresh-shop-gateway

  # 👇 👇 👇 就加这一段 Nacos 注册！！！ 👇 👇 👇
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        username: nacos
        password: nacos

    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates: Path=/api/user/**

        - id: address-service
          uri: http://localhost:8081
          predicates: Path=/api/address/**

        - id: cart-service
          uri: http://localhost:8081
          predicates: Path=/api/cart/**

        - id: role-service
          uri: http://localhost:8081
          predicates: Path=/api/role/**

        - id: permission-service
          uri: http://localhost:8081
          predicates: Path=/api/permission/**

        - id: goods-service
          uri: http://localhost:8083
          predicates: Path=/api/goods/**

        - id: category-service
          uri: http://localhost:8083
          predicates: Path=/api/category/**

        - id: order-service
          uri: http://localhost:8082
          predicates: Path=/api/order/**

        - id: order-admin
          uri: http://localhost:8082
          predicates: Path=/api/admin/order/**

        - id: coupon-service
          uri: http://localhost:8084
          predicates: Path=/api/coupon/**

        - id: seckill-service
          uri: http://localhost:8084
          predicates: Path=/api/seckill/**

        - id: marketing-admin
          uri: http://localhost:8084
          predicates: Path=/api/admin/seckill/**

        - id: file-service
          uri: http://localhost:8085
          predicates: Path=/api/file/**