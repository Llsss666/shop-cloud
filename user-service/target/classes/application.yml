server:
  port: 8081

spring:
  application:
    name: user-service

  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        username: nacos
        password: nacos

  datasource:
    url: jdbc:mysql://localhost:3306/fresh_shop?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: Ls010203
    driver-class-name: com.mysql.cj.jdbc.Driver

  redis:
    host: localhost
    port: 6379
    database: 0

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

# Seata 全本地file模式，不再依赖Nacos配置中心
seata:
  tx-service-group: freshshop_tx_group
  config:
    type: file
  registry:
    type: file
  service:
    vgroup-mapping:
      freshshop_tx_group: default
    grouplist:
      default: 127.0.0.1:8091
  datasource:
    proxy:
      enable: true
  # 关键修改：序列化改为 seata(protobuf)，兼容 JDK17
  transport:
    serialization: seata
    compressor: none
    max-frame-size: 20971520